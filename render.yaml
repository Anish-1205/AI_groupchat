services:
  - type: web
    name: ai-groupchat-api
    runtime: node
    plan: free
    rootDir: AI-GroupChat-main/AI-GroupChat-main
    buildCommand: npm install --include=dev
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
  - type: web
    name: ai-groupchat-web
    runtime: static
    rootDir: AI-GroupChat-frontend-main/AI-GroupChat-frontend-main
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: VITE_WS_URL
        value: wss://ai-groupchat-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
